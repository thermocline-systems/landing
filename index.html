<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thermocline · Critical Cooling Infrastructure</title>
<meta name="description" content="Thermocline — critical cooling infrastructure for the world's most demanding compute. In stealth.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23E85D2A'/%3E%3Cstop offset='1' stop-color='%232C7EBE'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' fill='%2307090d'/%3E%3Ccircle cx='16' cy='16' r='9' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:#07090d; }

  :root{
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", sans-serif;
    --ink: #07090d;
    --fg: #c9d2dc;
    --dim: #98a2ad;
    --faint: #6b7580;
  }

  .stage{
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--ink);
    color: var(--fg);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  #therm{ position:absolute; inset:0; width:100%; height:100%; display:block; z-index:0; }

  /* vignette to seat the type and deepen the edges */
  .veil{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background: radial-gradient(130% 90% at 50% 52%, transparent 38%, rgba(3,5,8,.62) 100%);
  }

  .ui{
    position:absolute; inset:0; z-index:2;
    display:flex; flex-direction:column;
    padding: clamp(22px, 4vw, 46px);
  }

  .row{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }

  .mono{ font-family:var(--mono); font-size:11px; letter-spacing:.26em; text-transform:uppercase; }

  .wm{
    font-family:var(--mono); font-size:12px; letter-spacing:.44em;
    text-transform:uppercase; font-weight:600;
    background:linear-gradient(90deg,#DE4517 0%,#DD6B12 16%,#CF8F10 30%,#A8901A 44%,#6E991E 57%,#3C9C3A 70%,#229A7C 82%,#1C92BE 92%,#2C7EBE 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
  }
  .stealth{ color:var(--faint); }
  .stealth::before{
    content:""; display:inline-block; width:6px; height:6px; border-radius:50%;
    background:#3c9c6a; margin-right:9px; vertical-align:middle;
    box-shadow:0 0 8px rgba(60,156,106,.9); animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:.45} 50%{opacity:1} }

  .mid{ flex:1; display:flex; flex-direction:column; justify-content:center; max-width:20ch; }
  h1{
    font-weight:300; font-size:clamp(42px, 8.6vw, 98px);
    line-height:.97; letter-spacing:-.038em; text-wrap:balance;
    text-shadow:0 2px 48px rgba(0,0,0,.5);
  }
  .sub{
    margin-top: clamp(18px, 3vw, 28px); max-width:40ch;
    font-size: clamp(14px, 1.55vw, 17px); line-height:1.62; color:var(--dim); font-weight:300;
    text-wrap:pretty;
  }

  .foot{ align-items:center; }
  .email{
    font-family:var(--mono); font-size:13px; letter-spacing:.04em; color:var(--fg);
    text-decoration:none; border-bottom:1px solid rgba(201,210,220,.35); padding-bottom:3px;
    transition:border-color .2s ease;
  }
  .email:hover{ border-color:var(--fg); }
  .loc{ color:var(--faint); }

  a:focus-visible{ outline:2px solid #7fd0ea; outline-offset:4px; border-radius:2px; }

  @media (max-width:640px){
    .foot{ flex-direction:column; align-items:flex-start; gap:14px; }
    .mid{ max-width:15ch; }
  }
  @media (prefers-reduced-motion:reduce){
    .stealth::before{ animation:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <canvas id="therm"></canvas>
  <div class="veil"></div>

  <div class="ui">
    <div class="row">
      <span class="wm">Thermocline</span>
      <span class="mono stealth">In&nbsp;stealth</span>
    </div>

    <div class="mid">
      <h1>Where the heat goes.</h1>
      <p class="sub">Critical cooling infrastructure for the world's most demanding compute. More in time.</p>
    </div>

    <div class="row foot">
      <a class="email" href="mailto:approach@thermocline.io">approach@thermocline.io</a>
      <span class="mono loc">San&nbsp;Francisco · Copenhagen</span>
    </div>
  </div>
</div>

<script>
(function(){
  var cv = document.getElementById('therm');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, dpr = 1;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (reduced) draw(0);
  }

  function lerp(a,b,t){ return a + (b-a)*t; }

  function draw(t){
    ctx.clearRect(0,0,W,H);

    // deep water ground: faint warm crown, cool floor
    var bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0.00,'#0c0806');
    bg.addColorStop(0.40,'#0a0d12');
    bg.addColorStop(0.54,'#0a0f16');
    bg.addColorStop(1.00,'#05080d');
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

    var cy = H * 0.54;

    // warm wash rising to the seam, cool wash falling from it
    var wg = ctx.createLinearGradient(0, cy - H*0.34, 0, cy);
    wg.addColorStop(0,'rgba(226,84,32,0)');
    wg.addColorStop(1,'rgba(228,96,40,0.11)');
    ctx.fillStyle = wg; ctx.fillRect(0, cy - H*0.34, W, H*0.34);

    var cg = ctx.createLinearGradient(0, cy, 0, cy + H*0.36);
    cg.addColorStop(0,'rgba(34,150,196,0.13)');
    cg.addColorStop(1,'rgba(30,120,190,0)');
    ctx.fillStyle = cg; ctx.fillRect(0, cy, W, H*0.36);

    // faint isotherm strata — warm at top, cool at bottom
    var lines = 11;
    for (var i=0;i<lines;i++){
      var frac = i/(lines-1);
      var baseY = H*0.16 + frac*H*0.70;
      ctx.beginPath();
      for (var x=0;x<=W;x+=14){
        var y = baseY
          + Math.sin(x*0.0060 + t*0.00040 + i*0.9)*6
          + Math.sin(x*0.0130 - t*0.00060 + i)*3.4;
        if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      var r = Math.round(lerp(224,70,frac));
      var g = Math.round(lerp(112,150,frac));
      var b = Math.round(lerp(64,200,frac));
      // fade lines out as they near the bright seam so the seam reads clean
      var near = 1 - Math.max(0, 1 - Math.abs(baseY - cy)/(H*0.16));
      ctx.strokeStyle = 'rgba('+r+','+g+','+b+','+(0.05 + 0.06*near).toFixed(3)+')';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // the thermocline — one bright, drifting seam
    ctx.save();
    ctx.beginPath();
    for (var x2=0;x2<=W;x2+=8){
      var ys = cy
        + Math.sin(x2*0.0050 + t*0.00050)*10
        + Math.sin(x2*0.0110 - t*0.00072)*5.5;
      if (x2===0) ctx.moveTo(x2,ys); else ctx.lineTo(x2,ys);
    }
    var sg = ctx.createLinearGradient(0,0,W,0);
    sg.addColorStop(0.00,'rgba(232,120,50,0.62)');
    sg.addColorStop(0.50,'rgba(233,240,255,0.95)');
    sg.addColorStop(1.00,'rgba(45,150,210,0.72)');
    ctx.strokeStyle = sg; ctx.lineWidth = 1.5;
    ctx.shadowBlur = 22; ctx.shadowColor = 'rgba(120,200,240,0.5)';
    ctx.stroke();
    ctx.restore();
  }

  var start = null;
  function frame(ts){
    if (start === null) start = ts;
    draw(ts - start);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize, {passive:true});
  resize();
  if (!reduced) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
